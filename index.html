<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wakacyjne UNO - Board & Mobile</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --beach-sand: #f6d5b2;
            --ocean-blue: #0077be;
            --palm-green: #38761d;
            --uno-red: #ff5555;
            --uno-yellow: #ffaa00;
            --uno-green: #55aa55;
            --uno-blue: #5555ff;
            --uno-black: #222;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--ocean-blue) url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            color: white;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* --- LOBBY / MENU STARTOWE --- */
        #lobby {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .lobby-box {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn {
            padding: 12px 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            background: var(--palm-green);
            color: white;
            border: none;
            border-radius: 25px;
            margin: 8px 0;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn-blue { background: var(--ocean-blue); }
        .btn-danger { background: var(--uno-red); }
        .btn-small { width: auto; padding: 4px 10px; font-size: 0.8em; }

        input {
            padding: 12px;
            border-radius: 15px;
            border: none;
            text-align: center;
            font-size: 1.1em;
            margin: 8px 0;
            width: 100%;
            outline: none;
        }

        .divider {
            margin: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.15);
            padding: 8px 12px;
            border-radius: 8px;
            margin: 5px 0;
        }

        /* --- EKRAN GŁÓWNY (STÓŁ / TV / LAPTOP) --- */
        #game-table {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .player-node {
            position: absolute;
            background: rgba(0,0,0,0.7);
            padding: 15px 25px;
            border-radius: 15px;
            text-align: center;
            min-width: 140px;
            border: 3px solid transparent;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .player-node.active-turn {
            border-color: var(--uno-yellow);
            box-shadow: 0 0 25px var(--uno-yellow);
            transform: scale(1.1);
        }

        .player-name { font-weight: bold; font-size: 1.2em; }
        .card-count { font-size: 2.5em; font-weight: bold; color: var(--uno-yellow); margin: 5px 0; }
        .status-tag { font-size: 0.9em; color: #ff6666; font-weight: bold; }

        /* Układ graczy wokół ekranu */
        #p-pos-0 { bottom: 40px; left: 50%; transform: translateX(-50%); }
        #p-pos-1 { top: 40px; left: 50%; transform: translateX(-50%); }
        #p-pos-2 { top: 50%; left: 40px; transform: translateY(-50%); }
        #p-pos-3 { top: 50%; right: 40px; transform: translateY(-50%); }

        #center-deck {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .pile {
            width: 120px;
            height: 175px;
            border-radius: 12px;
            border: 3px solid white;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        #draw-pile {
            background: var(--uno-black);
            background-image: repeating-linear-gradient(45deg, #222, #222 10px, #333 10px, #333 20px);
        }

        /* --- WYGLĄD KART --- */
        .card {
            width: 120px;
            height: 175px;
            border-radius: 12px;
            border: 3px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.2em;
            font-weight: 900;
            color: white;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            position: absolute;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .card.red { background-color: var(--uno-red); }
        .card.green { background-color: var(--uno-green); }
        .card.blue { background-color: var(--uno-blue); }
        .card.yellow { background-color: var(--uno-yellow); }
        .card.black { background-color: var(--uno-black); }

        .card-inner {
            width: 80%; height: 80%;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(-15deg);
        }

        /* --- WIDOK TELEFONU --- */
        #phone-view {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: 220px;
            background: rgba(246, 213, 178, 0.98);
            border-top: 6px solid var(--palm-green);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #hand {
            display: flex;
            height: 100%;
            align-items: center;
            padding: 0 20px;
        }

        #hand .card {
            position: relative;
            margin-left: -60px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #hand .card:first-child { margin-left: 0; }
        #hand .card:hover { transform: translateY(-20px) !important; z-index: 100; }
        #hand .card.selected { border-color: #ffff00; transform: translateY(-35px) !important; z-index: 101; }

        #phone-status-bar {
            position: absolute;
            top: -120px; left: 15px;
            display: flex; gap: 15px; align-items: flex-end;
            pointer-events: none;
        }

        #phone-current-card {
            width: 75px; height: 110px;
            border-radius: 10px;
            border: 2px solid white;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.2em; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #block-badge {
            background: rgba(255,0,0,0.9);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        #action-controls {
            position: absolute;
            top: -65px; right: 15px;
            display: flex; gap: 10px;
            pointer-events: auto;
        }

        /* Modal Wyboru Koloru */
        #color-modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000;
            justify-content: center; align-items: center; gap: 20px;
        }
        .color-btn {
            width: 80px; height: 80px; border-radius: 50%; cursor: pointer; border: 4px solid white;
            transition: transform 0.2s;
        }
        .color-btn:hover { transform: scale(1.15); }
    </style>
</head>
<body>

    <!-- MENU / LOBBY -->
    <div id="lobby">
        <div class="lobby-box">
            <h2 style="margin-top:0;">🌅 Wakacyjne UNO</h2>

            <div id="role-selection">
                <button class="btn" onclick="startHostDisplay()">🖥️ Otwórz Ekran Główny (TV/Laptop)</button>
                <div class="divider"></div>
                <input type="text" id="player-name-input" placeholder="Twoje Imię / Nick" maxlength="12">
                <input type="text" id="join-code-input" placeholder="Kod Pokoju (4 cyfry)" maxlength="4">
                <button class="btn btn-blue" onclick="startClientPlayer()">📱 Dołącz z Telefonu</button>
            </div>

            <!-- Panel Hosta na Ekranie Głównym -->
            <div id="host-panel" style="display:none;">
                <p style="margin:5px 0;">Kod Pokoju do Dołączenia:</p>
                <h1 id="room-code-display" style="color:var(--uno-yellow); margin:5px 0; font-size:3em;">----</h1>
                <p>Dołączeni Gracze:</p>
                <div id="player-list"></div>
                <button class="btn btn-danger" style="margin-top:15px;" onclick="hostStartGame()">ZACZNIJ GRĘ</button>
            </div>

            <div id="lobby-status" style="margin-top: 15px; font-size: 0.9em; color: #aaa;"></div>
        </div>
    </div>

    <!-- EKRAN GŁÓWNY (STÓŁ) -->
    <div id="game-table">
        <div id="p-pos-0" class="player-node" style="display:none;"><div class="player-name">P1</div><div class="card-count">0</div><div class="status-tag"></div></div>
        <div id="p-pos-1" class="player-node" style="display:none;"><div class="player-name">P2</div><div class="card-count">0</div><div class="status-tag"></div></div>
        <div id="p-pos-2" class="player-node" style="display:none;"><div class="player-name">P3</div><div class="card-count">0</div><div class="status-tag"></div></div>
        <div id="p-pos-3" class="player-node" style="display:none;"><div class="player-name">P4</div><div class="card-count">0</div><div class="status-tag"></div></div>

        <div id="center-deck">
            <div id="draw-pile" class="pile"></div>
            <div id="discard-pile" class="pile"></div>
        </div>
    </div>

    <!-- INTERFEJS TELEFONU GRACZA -->
    <div id="phone-view">
        <div id="phone-status-bar">
            <div id="phone-current-card" class="card red">?</div>
            <div id="block-badge">
                <div style="font-size: 1.2em;">🚫</div>
                <div id="block-count-text">Stoisz: 1</div>
            </div>
        </div>

        <div id="action-controls">
            <button id="btn-draw" class="btn btn-blue" style="width:auto;" onclick="userRequestDraw()">Dobierz</button>
            <button id="btn-play-stack" class="btn" style="background: var(--uno-yellow); display:none; width:auto;" onclick="userPlayStack()">Rzuć</button>
            <button id="btn-uno" class="btn btn-danger" style="width:auto;" onclick="userPressUno()">UNO!</button>
        </div>

        <div id="hand"></div>
    </div>

    <!-- WYBÓR KOLORU -->
    <div id="color-modal">
        <div class="color-btn" style="background:var(--uno-red)" onclick="userChooseColor('red')"></div>
        <div class="color-btn" style="background:var(--uno-blue)" onclick="userChooseColor('blue')"></div>
        <div class="color-btn" style="background:var(--uno-green)" onclick="userChooseColor('green')"></div>
        <div class="color-btn" style="background:var(--uno-yellow)" onclick="userChooseColor('yellow')"></div>
    </div>

    <script>
        const PEER_PREFIX = "VAC_UNO_2026_ROOM_";
        let peer = null;
        let isHostDisplay = false;
        let roomCode = "";
        let hostConns = []; // Dla Ekranu Głównego: lista połączeń z graczami
        let clientConn = null; // Dla Telefonu: połączenie z Ekranem Głównym

        // --- OBSŁUGA NETWORKINGU & LOBBY ---

        function generateCode() { return Math.floor(1000 + Math.random() * 9000).toString(); }

        // 1. URUCHOMIENIE EKRANU GŁÓWNEGO (HOST)
        function startHostDisplay() {
            isHostDisplay = true;
            roomCode = generateCode();
            peer = new Peer(PEER_PREFIX + roomCode);

            document.getElementById('role-selection').style.display = 'none';
            document.getElementById('host-panel').style.display = 'block';
            document.getElementById('room-code-display').innerText = roomCode;

            peer.on('connection', (conn) => {
                if (hostConns.length >= 4 || gameState.started) {
                    conn.on('open', () => conn.send({ type: 'REJECTED' }));
                    setTimeout(() => conn.close(), 500);
                    return;
                }

                conn.on('data', (data) => {
                    if (data.type === 'JOIN_REQ') {
                        hostConns.push({ conn: conn, id: conn.peer, name: data.name });
                        updateHostLobbyUI();
                    } else {
                        handleHostIncomingAction(conn.peer, data);
                    }
                });

                conn.on('close', () => {
                    hostConns = hostConns.filter(c => c.conn !== conn);
                    updateHostLobbyUI();
                });
            });
        }

        function updateHostLobbyUI() {
            const listEl = document.getElementById('player-list');
            listEl.innerHTML = '';
            hostConns.forEach(c => {
                listEl.innerHTML += `
                    <div class="player-item">
                        <span>📱 ${c.name}</span>
                        <button class="btn btn-danger btn-small" onclick="kickPlayer('${c.id}')">Usuń</button>
                    </div>`;
            });
        }

        function kickPlayer(peerId) {
            const item = hostConns.find(c => c.id === peerId);
            if (item) {
                item.conn.send({ type: 'REJECTED' });
                item.conn.close();
                hostConns = hostConns.filter(c => c.id !== peerId);
                updateHostLobbyUI();
            }
        }

        // 2. DOŁĄCZENIE Z TELEFONU (GRACZ)
        function startClientPlayer() {
            const name = document.getElementById('player-name-input').value.trim();
            const code = document.getElementById('join-code-input').value.trim();

            if (!name) return alert("Wpisz swoje imię!");
            if (code.length !== 4) return alert("Wpisz 4-cyfrowy kod pokoju!");

            peer = new Peer();
            document.getElementById('lobby-status').innerText = "Łączenie z Ekranem Głównym...";

            peer.on('open', () => {
                clientConn = peer.connect(PEER_PREFIX + code);

                clientConn.on('open', () => {
                    clientConn.send({ type: 'JOIN_REQ', name: name });
                    document.getElementById('lobby-status').innerText = "Połączono! Czekaj na start gry...";
                });

                clientConn.on('data', (data) => handleClientIncomingData(data));
                clientConn.on('close', () => { alert("Rozłączono."); location.reload(); });
            });

            peer.on('error', () => alert("Nie znaleziono takiego pokoju!"));
        }

        // --- SILNIK LOGIKI UNO (EKRAN GŁÓWNY) ---

        let gameState = {
            started: false,
            players: [], // { id, peerId, name, hand: [], blocksToStand: 0, unoCalled: false }
            deck: [],
            discardPile: [],
            currentTurn: 0,
            direction: 1,
            forcedDrawCount: 0,
            blocksStacked: 0,
            currentColor: 'red',
            currentValue: '0',
            waitingForColor: false
        };

        function hostStartGame() {
            if (hostConns.length < 2) return alert("Do gry potrzeba co najmniej 2 graczy na telefonach!");

            gameState.players = hostConns.map((c, idx) => ({
                id: idx,
                peerId: c.id,
                name: c.name,
                hand: [],
                blocksToStand: 0,
                unoCalled: false
            }));

            buildDeck();
            shuffle(gameState.deck);

            // Rozdaj po 7 kart
            gameState.players.forEach(p => p.hand = gameState.deck.splice(0, 7));

            // Pierwsza karta (0-9)
            let startIdx = gameState.deck.findIndex(c => c.type === 'number');
            let startCard = gameState.deck.splice(startIdx, 1)[0];
            gameState.discardPile.push(startCard);
            gameState.currentColor = startCard.color;
            gameState.currentValue = startCard.value;

            gameState.started = true;
            gameState.currentTurn = 0;

            broadcastState();
        }

        function buildDeck() {
            const colors = ['red', 'green', 'blue', 'yellow'];
            colors.forEach(color => {
                gameState.deck.push({ id: Math.random(), type: 'number', color, value: '0' });
                for (let i = 1; i <= 9; i++) {
                    gameState.deck.push({ id: Math.random(), type: 'number', color, value: i.toString() });
                    gameState.deck.push({ id: Math.random(), type: 'number', color, value: i.toString() });
                }
                for (let i = 0; i < 2; i++) {
                    gameState.deck.push({ id: Math.random(), type: 'block', color, value: '🚫' });
                    gameState.deck.push({ id: Math.random(), type: 'reverse', color, value: '🔁' });
                    gameState.deck.push({ id: Math.random(), type: 'plus2', color, value: '+2' });
                }
            });
            for (let i = 0; i < 4; i++) {
                gameState.deck.push({ id: Math.random(), type: 'wild', color: 'black', value: '🎨' });
                gameState.deck.push({ id: Math.random(), type: 'wild4', color: 'black', value: '+4' });
            }
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
        }

        function broadcastState() {
            const publicPlayers = gameState.players.map(p => ({
                id: p.id,
                name: p.name,
                cardCount: p.hand.length,
                blocksToStand: p.blocksToStand
            }));

            // Aktualizacja samego Ekranu Głównego
            renderBoardForDisplay({
                topCard: gameState.discardPile[gameState.discardPile.length - 1],
                currentColor: gameState.currentColor,
                currentTurn: gameState.currentTurn,
                players: publicPlayers
            });

            // Wysyłanie spersonalizowanego stanu na telefony
            hostConns.forEach(c => {
                const p = gameState.players.find(item => item.peerId === c.id);
                if (p) {
                    c.conn.send({
                        type: 'STATE_UPDATE',
                        topCard: gameState.discardPile[gameState.discardPile.length - 1],
                        currentColor: gameState.currentColor,
                        currentTurn: gameState.currentTurn,
                        waitingForColor: gameState.waitingForColor,
                        yourHand: p.hand,
                        yourBlocks: p.blocksToStand,
                        yourId: p.id
                    });
                }
            });
        }

        function handleHostIncomingAction(peerId, action) {
            const player = gameState.players.find(p => p.peerId === peerId);
            if (!player) return;

            if (action.type === 'ACTION_PLAY_STACK') {
                if (gameState.currentTurn !== player.id || gameState.waitingForColor) return;
                processPlayCards(player, action.cardIds);
            } else if (action.type === 'ACTION_DRAW') {
                if (gameState.currentTurn !== player.id || gameState.waitingForColor) return;
                processDrawCard(player);
            } else if (action.type === 'ACTION_SELECT_COLOR') {
                if (gameState.currentTurn !== player.id || !gameState.waitingForColor) return;
                gameState.currentColor = action.color;
                gameState.waitingForColor = false;
                nextTurn();
            } else if (action.type === 'ACTION_UNO') {
                player.unoCalled = true;
            }
        }

        function processPlayCards(player, cardIds) {
            let cards = player.hand.filter(c => cardIds.includes(c.id));
            if (cards.length === 0) return;

            const firstCard = cards[0];
            const topCard = gameState.discardPile[gameState.discardPile.length - 1];

            let isValid = false;

            if (gameState.forcedDrawCount > 0) {
                if (topCard.value === '+2' && firstCard.value === '+2') isValid = true;
                if (topCard.value === '+4' && (firstCard.value === '+4' || firstCard.value === '+2')) isValid = true;
            } else if (gameState.blocksStacked > 0) {
                if (firstCard.type === 'block') isValid = true;
            } else {
                if (firstCard.color === gameState.currentColor || firstCard.value === gameState.currentValue || firstCard.color === 'black') {
                    isValid = true;
                }
            }

            if (cards.length > 1 && !cards.every(c => c.value === firstCard.value)) isValid = false;
            if (!isValid) return;

            // Kara za brak zgłoszenia UNO
            if (player.hand.length - cards.length === 1 && !player.unoCalled) {
                for (let i = 0; i < 2; i++) {
                    if (gameState.deck.length > 0) player.hand.push(gameState.deck.pop());
                }
            }
            player.unoCalled = false;

            // Usunięcie z ręki i dodanie na stół
            player.hand = player.hand.filter(c => !cardIds.includes(c.id));
            cards.forEach(c => gameState.discardPile.push(c));

            const lastCard = cards[cards.length - 1];
            gameState.currentColor = lastCard.color !== 'black' ? lastCard.color : gameState.currentColor;
            gameState.currentValue = lastCard.value;

            // Efekty
            const count = cards.length;
            if (lastCard.type === 'plus2') gameState.forcedDrawCount += 2 * count;
            if (lastCard.type === 'wild4') gameState.forcedDrawCount += 4 * count;
            if (lastCard.type === 'block') gameState.blocksStacked += count;
            if (lastCard.type === 'reverse' && gameState.players.length > 2 && count % 2 !== 0) {
                gameState.direction *= -1;
            }

            if (player.hand.length === 0) {
                alert(`🏆 GRACZ ${player.name} WYGRAŁ ROZGRYWKĘ!`);
                location.reload();
                return;
            }

            if (lastCard.color === 'black') {
                gameState.waitingForColor = true;
                broadcastState();
            } else {
                nextTurn();
            }
        }

        function processDrawCard(player) {
            if (gameState.forcedDrawCount > 0) {
                for (let i = 0; i < gameState.forcedDrawCount; i++) {
                    if (gameState.deck.length === 0) refuelDeck();
                    player.hand.push(gameState.deck.pop());
                }
                gameState.forcedDrawCount = 0;
            } else if (gameState.blocksStacked > 0) {
                player.blocksToStand = gameState.blocksStacked;
                gameState.blocksStacked = 0;
            } else {
                if (gameState.deck.length === 0) refuelDeck();
                player.hand.push(gameState.deck.pop());
            }
            nextTurn();
        }

        function refuelDeck() {
            if (gameState.discardPile.length <= 1) return;
            const top = gameState.discardPile.pop();
            gameState.deck = gameState.discardPile;
            gameState.discardPile = [top];
            shuffle(gameState.deck);
        }

        function nextTurn() {
            do {
                gameState.currentTurn = (gameState.currentTurn + gameState.direction + gameState.players.length) % gameState.players.length;
                let active = gameState.players[gameState.currentTurn];
                if (active.blocksToStand > 0) {
                    active.blocksToStand--;
                } else {
                    break;
                }
            } while (true);

            broadcastState();
        }

        // --- RENDEROWANIE DLA EKRANU GŁÓWNEGO ---

        function renderBoardForDisplay(data) {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('game-table').style.display = 'block';

            const discardEl = document.getElementById('discard-pile');
            discardEl.innerHTML = '';
            if (data.topCard) {
                const el = document.createElement('div');
                el.className = `card ${data.currentColor}`;
                el.innerHTML = `<div class="card-inner">${data.topCard.value}</div>`;
                discardEl.appendChild(el);
            }

            data.players.forEach((p, idx) => {
                const node = document.getElementById(`p-pos-${idx}`);
                if (node) {
                    node.style.display = 'block';
                    node.querySelector('.player-name').innerText = p.name;
                    node.querySelector('.card-count').innerText = p.cardCount;
                    node.querySelector('.status-tag').innerText = p.blocksToStand > 0 ? `🚫 Stoi: ${p.blocksToStand}` : '';

                    if (idx === data.currentTurn) node.classList.add('active-turn');
                    else node.classList.remove('active-turn');
                }
            });
        }

        // --- LOGIKA I RENDEROWANIE DLA TELEFONU ---

        let clientHand = [];
        let selectedCards = [];

        function handleClientIncomingData(data) {
            if (data.type === 'REJECTED') {
                alert("Nie można dołączyć do tego pokoju.");
                location.reload();
                return;
            }

            if (data.type === 'STATE_UPDATE') {
                document.getElementById('lobby').style.display = 'none';
                document.getElementById('phone-view').style.display = 'flex';

                clientHand = data.yourHand;

                // Karta na stosie
                const cur = document.getElementById('phone-current-card');
                cur.className = `card ${data.currentColor}`;
                cur.innerHTML = `<div class="card-inner">${data.topCard ? data.topCard.value : '?'}</div>`;

                // Status blokady
                const blockB = document.getElementById('block-badge');
                if (data.yourBlocks > 0) {
                    blockB.style.display = 'block';
                    document.getElementById('block-count-text').innerText = `Stoisz: ${data.yourBlocks}`;
                } else {
                    blockB.style.display = 'none';
                }

                // Modal koloru
                if (data.waitingForColor && data.currentTurn === data.yourId) {
                    document.getElementById('color-modal').style.display = 'flex';
                } else {
                    document.getElementById('color-modal').style.display = 'none';
                }

                renderHandUI();
            }
        }

        function renderHandUI() {
            const handContainer = document.getElementById('hand');
            handContainer.innerHTML = '';

            clientHand.forEach((card, idx) => {
                const el = document.createElement('div');
                el.className = `card ${card.color}`;
                el.innerHTML = `<div class="card-inner">${card.value}</div>`;

                const rot = (idx - clientHand.length / 2) * 4;
                el.style.transform = `rotate(${rot}deg)`;

                if (selectedCards.includes(card.id)) el.classList.add('selected');

                el.onclick = () => {
                    if (selectedCards.includes(card.id)) {
                        selectedCards = selectedCards.filter(id => id !== card.id);
                    } else {
                        if (selectedCards.length > 0) {
                            const first = clientHand.find(c => c.id === selectedCards[0]);
                            if (first.value !== card.value || card.color === 'black') {
                                alert("Możesz grupować tylko karty z tym samym numerem/symbolikiem!");
                                return;
                            }
                        }
                        selectedCards.push(card.id);
                    }
                    renderHandUI();
                };

                handContainer.appendChild(el);
            });

            const playBtn = document.getElementById('btn-play-stack');
            if (selectedCards.length > 0) {
                playBtn.style.display = 'inline-block';
                playBtn.innerText = selectedCards.length > 1 ? `Rzuć (${selectedCards.length})` : 'Rzuć';
            } else {
                playBtn.style.display = 'none';
            }
        }

        function userPlayStack() {
            if (selectedCards.length === 0) return;
            clientConn.send({ type: 'ACTION_PLAY_STACK', cardIds: selectedCards });
            selectedCards = [];
        }

        function userRequestDraw() {
            clientConn.send({ type: 'ACTION_DRAW' });
        }

        function userChooseColor(color) {
            clientConn.send({ type: 'ACTION_SELECT_COLOR', color });
            document.getElementById('color-modal').style.display = 'none';
        }

        function userPressUno() {
            clientConn.send({ type: 'ACTION_UNO' });
            alert("Krzyknięto UNO!");
        }
    </script>
</body>
</html>
