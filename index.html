<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wakacyjne UNO Multiplayer</title>
    <!-- Dołączenie biblioteki PeerJS dla P2P Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --beach-sand: #f6d5b2;
            --ocean-blue: #0077be;
            --palm-green: #38761d;
            --uno-red: #ff5555;
            --uno-yellow: #ffaa00;
            --uno-green: #55aa55;
            --uno-blue: #5555ff;
            --uno-black: #222;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--ocean-blue) url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        /* Ekran Ładowania/Menu */
        #lobby {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            background: var(--palm-green);
            color: white;
            border: none;
            border-radius: 25px;
            margin: 10px;
            transition: transform 0.2s;
        }

        .btn:hover { transform: scale(1.05); }
        input { padding: 15px; border-radius: 25px; border: none; text-align: center; font-size: 1.1em;}

        /* --- Widok Główny (LAPTOP / STÓŁ) --- */
        #game-table {
            display: none; /* Domyślnie ukryty */
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Gracze rozsypani po ekranie (Widok Laptopa) */
        .player-info {
            position: absolute;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            min-width: 100px;
            border: 2px solid transparent;
        }

        .player-info.active-turn {
            border-color: var(--uno-yellow);
            box-shadow: 0 0 15px var(--uno-yellow);
        }

        #p1-info { top: 20px; left: 50%; transform: translateX(-50%); } /* Góra */
        #p2-info { top: 50%; right: 20px; transform: translateY(-50%); } /* Prawo */
        #p3-info { bottom: 120px; left: 50%; transform: translateX(-50%); } /* Dół (nad ręką) */
        #p4-info { top: 50%; left: 20px; transform: translateY(-50%); } /* Lewo */

        .card-count { font-size: 2em; font-weight: bold; }

        /* Środek stołu */
        #center-deck {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .pile {
            width: 100px;
            height: 150px;
            border-radius: 10px;
            border: 2px solid white;
            position: relative;
            background-size: cover;
        }

        #draw-pile {
            background: var(--uno-black);
            background-image: repeating-linear-gradient(45deg, #222, #222 10px, #333 10px, #333 20px);
            cursor: pointer;
            box-shadow: -5px 5px 0 rgba(0,0,0,0.2);
        }

        #discard-pile {
            background: white;
            transition: background 0.3s;
        }

        /* Wygląd Karty */
        .card {
            width: 100px;
            height: 150px;
            border-radius: 10px;
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            position: absolute;
            backface-visibility: hidden;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s;
            cursor: pointer;
            user-select: none;
        }

        .card.red { background-color: var(--uno-red); }
        .card.green { background-color: var(--uno-green); }
        .card.blue { background-color: var(--uno-blue); }
        .card.yellow { background-color: var(--uno-yellow); }
        .card.wild { background-color: var(--uno-black); }

        .card-inner-oval {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(-20deg);
        }

        /* --- Widok TELEFONU (Dół ekranu - Ręka gracza) --- */
        #player-hand-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: rgba(246, 213, 178, 0.9); /* Piaskowy, lekko przezroczysty */
            border-top: 5px solid var(--palm-green);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
        }

        #hand {
            display: flex;
            transition: all 0.3s;
            height: 100%;
            align-items: center;
        }

        #hand .card {
            position: relative;
            margin-left: -40px; /* Wachlarz */
            box-shadow: -2px 0 5px rgba(0,0,0,0.3);
        }

        #hand .card:first-child { margin-left: 0; }
        #hand .card:hover {
            transform: translateY(-20px) rotate(0deg) !important;
            z-index: 100;
        }

        #hand .card.selected-for-stack {
            border: 4px solid white;
            transform: translateY(-30px) !important;
        }

        /* UI Telefonu: Obecna Karta i Status */
        #phone-status-ui {
            position: absolute;
            top: -110px;
            left: 10px;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            pointer-events: none;
        }

        #current-card-indicator {
            width: 60px; height: 90px;
            border-radius: 8px;
            border: 2px solid white;
            background: gray;
            display: flex; justify-content: center; align-items: center;
            font-size: 2em; font-weight: bold;
        }

        #block-status {
            background: rgba(255,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            display: none; /* Ukryte, gdy nie ma blokady */
            text-align: center;
        }
        #block-icon { font-size: 2em; }

        /* Przycisk Akcji (Rzuć Stack / Dobierz / UNO) */
        #action-btn-container {
            position: absolute;
            right: 20px;
            top: -60px;
            pointer-events: auto;
        }

        /* --- ANIMACJE --- */
        @keyframes deal-card {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: var(--end-pos) rotate(var(--end-rot)); opacity: 1; }
        }

        .flying-card {
            position: absolute;
            z-index: 1000;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Kolory dla wyboru Wild Card */
        #color-picker {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 200;
            justify-content: center; align-items: center; gap: 20px;
        }
        .color-dot {
            width: 80px; height: 80px; border-radius: 50%; cursor: pointer; border: 4px solid white;
        }

    </style>
</head>
<body>

    <!-- LOBBY & LOGOWANIE -->
    <div id="lobby">
        <h1>🌅 Wakacyjne UNO</h1>
        <div id="connection-controls">
            <button class="btn" onclick="startHost()">Stwórz Pokój (Host)</button>
            <br><p>lub</p>
            <input type="text" id="join-id" placeholder="Wpisz ID Hosta"><br>
            <button class="btn" style="background-color: var(--ocean-blue);" onclick="startJoin()">Dołącz do Gry</button>
        </div>
        <div id="status-area" style="margin-top:20px;">Twój ID: <span id="my-id">...</span></div>
        <div id="host-start-game-area" style="display:none; margin-top:20px;">
            <p>Połączono graczy: <span id="connected-count">1</span>/4</p>
            <button class="btn" style="background-color: var(--uno-red);" onclick="hostRequestsStart()">ZACZNIJ GRĘ</button>
        </div>
    </div>

    <!-- STÓŁ GRY (WIDOK LAPTOPA) -->
    <div id="game-table">
        <!-- Info o graczach (porozucane) -->
        <div id="p1-info" class="player-info"><div>Gracz 1</div><div class="card-count">7</div>Karty</div>
        <div id="p2-info" class="player-info" style="display:none;"><div>Gracz 2</div><div class="card-count">7</div>Karty</div>
        <div id="p3-info" class="player-info" style="display:none;"><div>Gracz 3</div><div class="card-count">7</div>Karty</div>
        <div id="p4-info" class="player-info" style="display:none;"><div>Gracz 4</div><div class="card-count">7</div>Karty</div>

        <!-- Środek -->
        <div id="center-deck">
            <div id="draw-pile" class="pile" onclick="playerRequestsDraw()"></div>
            <div id="discard-pile" class="pile">
                <!-- Tu lądują rzucone karty -->
            </div>
        </div>
    </div>

    <!-- RĘKA GRACZA I UI (WIDOK TELEFONU) -->
    <div id="player-hand-container">
        
        <div id="phone-status-ui">
            <!-- Co jest teraz na sosie (dla telefonu) -->
            <div id="current-card-indicator" class="card red">?</div>
            
            <!-- Ikonka blokady -->
            <div id="block-status">
                <div id="block-icon">🚫</div>
                <div id="block-text">Stoisz: 1 rund</div>
            </div>
        </div>

        <div id="action-btn-container">
            <button id="multi-play-btn" class="btn" style="background: var(--uno-yellow); display:none;" onclick="playSelectedStack()">Rzuć Wybrane</button>
            <button id="uno-btn" class="btn" style="background: var(--uno-red); display:none;" onclick="pressUno()">UNO!</button>
        </div>

        <div id="hand">
            <!-- Karty gracza generowane dynamicznie -->
        </div>
    </div>

    <!-- Wybór koloru (Wild) -->
    <div id="color-picker">
        <div class="color-dot red" onclick="selectWildColor('red')" style="background:var(--uno-red)"></div>
        <div class="color-dot blue" onclick="selectWildColor('blue')" style="background:var(--uno-blue)"></div>
        <div class="color-dot green" onclick="selectWildColor('green')" style="background:var(--uno-green)"></div>
        <div class="color-dot yellow" onclick="selectWildColor('yellow')" style="background:var(--uno-yellow)"></div>
    </div>

    <script>
        /**
         * WAKACYJNE UNO - SILNIK P2P (PeerJS)
         * 
         * Architektura: Jeden gracz jest 'Hostem' (serwerem logicznym). 
         * Inni są klientami, wysyłają input, dostają stan gry.
         */

        const peer = new Peer(); // Utwórz instancję PeerJS
        let myId = null;
        let conn = null; // Dla klienta: połączenie z hostem
        let connections = []; // Dla hosta: lista połączeń z klientami
        let isHost = false;
        
        // Elementy UI
        const ui = {
            lobby: document.getElementById('lobby'),
            myIdSpan: document.getElementById('my-id'),
            connectedCount: document.getElementById('connected-count'),
            hand: document.getElementById('hand'),
            discard: document.getElementById('discard-pile'),
            drawPile: document.getElementById('draw-pile'),
            gameTable: document.getElementById('game-table'),
            phoneCardIdic: document.getElementById('current-card-indicator'),
            blockStatus: document.getElementById('block-status'),
            blockText: document.getElementById('block-text'),
            multiBtn: document.getElementById('multi-play-btn'),
            colorPicker: document.getElementById('color-picker')
        };

        // --- INICJALIZACJA SIECI ---

        peer.on('open', (id) => {
            myId = id;
            ui.myIdSpan.innerText = id;
            console.log('Mój Peer ID:', id);
        });

        // Logika HOSTA
        function startHost() {
            isHost = true;
            document.getElementById('connection-controls').style.display = 'none';
            document.getElementById('host-start-game-area').style.display = 'block';
            
            peer.on('connection', (c) => {
                if (connections.length >= 3 || gameState.started) {
                    c.on('open', () => c.send({type: 'ERROR', msg: 'Pokój pełny lub gra ruszyła'}));
                    setTimeout(() => c.close(), 500);
                    return;
                }
                
                connections.push(c);
                ui.connectedCount.innerText = connections.length + 1;
                setupChatConnection(c);
                console.log('Ktoś dołączył:', c.peer);
            });
        }

        // Logika KLIENTA
        function startJoin() {
            const hostId = document.getElementById('join-id').value;
            if (!hostId) return alert('Wpisz ID Hosta');
            
            conn = peer.connect(hostId);
            setupChatConnection(conn);
        }

        // Wspólne ustawienia kanału danych
        function setupChatConnection(c) {
            c.on('open', () => {
                console.log('Połączenie otwarte z:', c.peer);
                if (!isHost) {
                    ui.lobby.innerHTML = "<h1>Oczekiwanie na start hosta...</h1>";
                }
            });

            c.on('data', (data) => {
                handleNetworkMessage(data, c);
            });

            c.on('close', () => {
                console.log('Połączenie zamknięte:', c.peer);
                // Tu powinna być logika obsługi rozłączenia
            });
        }

        // --- SILNIK GRY (LOGIKA - TYLKO HOST) ---

        let gameState = {
            started: false,
            players: [], // {id, name, peerConn, hand: [], isBot: false}
            deck: [],
            discardPile: [],
            currentTurn: 0,
            direction: 1, // 1: CW, -1: CCW
            forcedDrawCount: 0, // Kumulacja +2 / +4
            blocksStacked: 0, // Kumulacja blokad
            currentPlayerBlocksToStand: 0, // Ile tur stoi obecny gracz
            currentColor: null,
            currentValue: null,
            waitingForColorSelect: false,
            unoPressed: false
        };

        function hostRequestsStart() {
            if (!isHost) return;
            if (connections.length < 1) { alert("Potrzebujesz min. 2 graczy"); return; }
            
            // Zainicjuj graczy
            gameState.players.push({ id: 0, peerId: myId, conn: null, hand: [], cardCount: 0, blocksToStand: 0 }); // Host
            connections.forEach((c, index) => {
                gameState.players.push({ id: index + 1, peerId: c.peer, conn: c, hand: [], cardCount: 0, blocksToStand: 0 });
            });

            createDeck();
            shuffleDeck(gameState.deck);
            dealInitialCards();
            
            // Otwórz pierwszą kartę (musi być 0-9 wg Twojej zasady)
            let firstCardIndex = gameState.deck.findIndex(c => c.type === 'number');
            let firstCard = gameState.deck.splice(firstCardIndex, 1)[0];
            gameState.discardPile.push(firstCard);
            gameState.currentColor = firstCard.color;
            gameState.currentValue = firstCard.value;

            gameState.started = true;
            gameState.currentTurn = 0; // Zaczyna host

            broadcastState();
            ui.lobby.style.display = 'none';
            ui.gameTable.style.display = 'block';
            renderBoard();
            renderHand();
        }

        // Tworzenie talii UNO
        function createDeck() {
            const colors = ['red', 'green', 'blue', 'yellow'];
            // Numery 0-9
            colors.forEach(color => {
                gameState.deck.push({type: 'number', color, value: 0, id: Math.random()}); // Jedno zero
                for(let i=1; i<=9; i++) {
                    gameState.deck.push({type: 'number', color, value: i, id: Math.random()}); // Dwie jedynki, dwójki itd.
                    gameState.deck.push({type: 'number', color, value: i, id: Math.random()});
                }
                // Akcyjne
                for(let i=0; i<2; i++) {
                    gameState.deck.push({type: 'block', color, value: '🚫', id: Math.random()});
                    gameState.deck.push({type: 'reverse', color, value: '🔁', id: Math.random()});
                    gameState.deck.push({type: 'plus2', color, value: '+2', id: Math.random()});
                }
            });
            // Czarne
            for(let i=0; i<4; i++) {
                gameState.deck.push({type: 'wild', color: 'black', value: 'W', id: Math.random()});
                gameState.deck.push({type: 'wild4', color: 'black', value: '+4', id: Math.random()});
            }
        }

        function shuffleDeck(deck) {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[deck[i]]];
            }
        }

        function dealInitialCards() {
            gameState.players.forEach(p => {
                for(let i=0; i<7; i++) {
                    p.hand.push(gameState.deck.pop());
                }
                p.cardCount = p.hand.length;
            });
        }

        // --- OBSŁUGA SIECI (WSPÓLNA) ---

        function handleNetworkMessage(data, senderConn) {
            console.log("Odebrano:", data);
            
            if (isHost) {
                // Host odbiera komendy od klientów
                let player = gameState.players.find(p => p.peerId === senderConn.peer);
                if (!player) return;

                switch(data.type) {
                    case 'TRY_PLAY_STACK':
                        handlePlayerPlayStack(player, data.cardIds);
                        break;
                    case 'TRY_DRAW':
                        handlePlayerDraw(player);
                        break;
                    case 'COLOR_SELECTED':
                        handleColorSelection(player, data.color);
                        break;
                }
            } else {
                // Klient odbiera stan od hosta
                switch(data.type) {
                    case 'GAME_STATE_UPDATE':
                        syncClientState(data.state);
                        break;
                    case 'ANIMATE_PLAY':
                        animateCardPlay(data.card, data.fromPlayerId, true);
                        break;
                    case 'ANIMATE_DRAW':
                        animateCardDraw(data.toPlayerId, true);
                        break;
                }
            }
        }

        // Host wysyła stan do wszystkich
        function broadcastState() {
            let commonState = {
                discardPileTop: gameState.discardPile[gameState.discardPile.length - 1],
                currentColor: gameState.currentColor,
                currentTurn: gameState.currentTurn,
                forcedDrawCount: gameState.forcedDrawCount,
                blocksStacked: gameState.blocksStacked,
                direction: gameState.direction,
                playersInfo: gameState.players.map(p => ({id: p.id, cardCount: p.hand.length, blocksToStand: p.blocksToStand})),
                waitingForColorSelect: gameState.waitingForColorSelect
            };

            gameState.players.forEach(p => {
                if (p.conn) {
                    // Wyślij stan ogólny + karty danego gracza
                    p.conn.send({
                        type: 'GAME_STATE_UPDATE',
                        state: { ...commonState, yourHand: p.hand, blocksToStand: p.blocksToStand }
                    });
                }
            });
            
            // Zaktualizuj też lokalne UI hosta
            syncClientState({ ...commonState, yourHand: gameState.players[0].hand, blocksToStand: gameState.players[0].blocksToStand });
        }

        function broadcastAnimation(type, payload) {
            gameState.players.forEach(p => {
                if(p.conn) p.conn.send({type, ...payload});
            });
        }

        // --- RENDEROWANIE I LOGIKA KLIENTA (Wspólna dla Hosta-Gracza i Klientów) ---

        let localInfo = {
            myHand: [],
            myIdInGame: null,
            selectedStackIds: [],
            isMyTurn: false
        };

        function syncClientState(state) {
            if (!gameState.started) {
                ui.lobby.style.display = 'none';
                ui.gameTable.style.display = 'block';
                gameState.started = true;
            }

            localInfo.myHand = state.yourHand;
            localInfo.isMyTurn = (state.playersInfo[state.currentTurn].peerId === myId); // To nie zadziała idealnie P2P bez mapowania IDs
            // Prostsze mapowanie dla prototypu: host to always p1, conns are p2, p3...
            localInfo.myIdInGame = isHost ? 0 : gameState.players?.find(p=>p.peerId === myId)?.id; // To wymaga poprawy w pełnej wersji
            
            // Tymczasowe mapowanie ID dla prototypu, zakładamy stałą kolejność
            if (!isHost && localInfo.myIdInGame === undefined) {
                 // Klient musi znaleźć swoje ID w liście playerInfo na podstawie PeerID
                 // W prototypie upraszczamy:
            }

            renderHand();
            renderBoard(state);
            updatePhoneUI(state);
        }

        function createCardEl(card) {
            const el = document.createElement('div');
            el.className = `card ${card.color}`;
            el.dataset.cardId = card.id;
            el.innerHTML = `<div class="card-inner-oval">${card.value}</div>`;
            return el;
        }

        function renderHand() {
            ui.hand.innerHTML = '';
            localInfo.myHand.forEach((card, index) => {
                const cardEl = createCardEl(card);
                
                // Kąt wachlarza
                const rot = (index - localInfo.myHand.length / 2) * 5;
                cardEl.style.transform = `rotate(${rot}deg)`;
                
                cardEl.onclick = () => onCardClicked(card, cardEl);
                ui.hand.appendChild(cardEl);
            });
            
            // Aktualizacja przycisku multi-play
            ui.multiBtn.style.display = localInfo.selectedStackIds.length > 1 ? 'block' : 'none';
        }

        function renderBoard(state) {
            if (!state) return;

            // Karta na stosie odrzuconych (Widok Laptopa)
            ui.discard.innerHTML = '';
            if (state.discardPileTop) {
                ui.discard.appendChild(createCardEl(state.discardPileTop));
            }

            // Info o graczach
            state.playersInfo.forEach((pInfo, index) => {
                const infoEl = document.getElementById(`p${index+1}-info`);
                if (infoEl) {
                    infoEl.style.display = 'block';
                    infoEl.querySelector('.card-count').innerText = pInfo.cardCount;
                    
                    // Oznaczenie tury
                    if (index === state.currentTurn) {
                        infoEl.classList.add('active-turn');
                    } else {
                        infoEl.classList.remove('active-turn');
                    }
                }
            });
        }

        function updatePhoneUI(state) {
            // Wskaźnik obecnej karty
            ui.phoneCardIdic.className = `card ${state.currentColor}`;
            ui.phoneCardIdic.innerText = state.discardPileTop ? state.discardPileTop.value : '?';

            // Status blokady
            if (state.blocksToStand > 0) {
                ui.blockStatus.style.display = 'flex';
                ui.blockText.innerText = `Stoisz: ${state.blocksToStand} rund`;
            } else {
                ui.blockStatus.style.display = 'none';
            }
        }

        // --- INTERAKCJA GRACZA (INPUT) ---

        function onCardClicked(card, cardEl) {
            // Sprawdź czy moja tura (uproszczenie w prototypie)
            // if (!localInfo.isMyTurn) return; 

            if (localInfo.selectedStackIds.includes(card.id)) {
                // Odznacz
                localInfo.selectedStackIds = localInfo.selectedStackIds.filter(id => id !== card.id);
                cardEl.classList.remove('selected-for-stack');
            } else {
                // Zaznacz
                if (localInfo.selectedStackIds.length > 0) {
                    // Sprawdź czy pasuje numerem do zaznaczonych (multi-stacking)
                    let firstSel = localInfo.myHand.find(c => c.id === localInfo.selectedStackIds[0]);
                    if (firstSel.value !== card.value || card.type === 'wild' || card.type === 'wild4') {
                        alert("Możesz grupować tylko karty o tym samym numerze/symbolu (nie czarne).");
                        return;
                    }
                }
                localInfo.selectedStackIds.push(card.id);
                cardEl.classList.add('selected-for-stack');
            }

            // Jeśli zaznaczono jedną i pasuje, rzuć od razu. Jeśli więcej - pokaż przycisk.
            if (localInfo.selectedStackIds.length === 1) {
                // Próba rzucenia pojedynczej (tylko jeśli nie jest częścią grupy)
                // W prototypie: rzucamy przyciskiem zawsze dla uproszczenia
                ui.multiBtn.style.display = 'block';
                ui.multiBtn.innerText = 'Rzuć Kartę';
            } else if (localInfo.selectedStackIds.length > 1) {
                ui.multiBtn.style.display = 'block';
                ui.multiBtn.innerText = `Rzuć Serię (${localInfo.selectedStackIds.length})`;
            } else {
                ui.multiBtn.style.display = 'none';
            }
        }

        function playSelectedStack() {
            if (localInfo.selectedStackIds.length === 0) return;

            const data = {
                type: 'TRY_PLAY_STACK',
                cardIds: localInfo.selectedStackIds
            };

            if (isHost) {
                handlePlayerPlayStack(gameState.players[0], data.cardIds);
            } else {
                conn.send(data);
            }

            // Animacja lokalna (optymistyczna)
            const firstCard = localInfo.myHand.find(c=>c.id === localInfo.selectedStackIds[0]);
            animateCardPlay(firstCard, 0, false); // Trzeba poprawić ID gracza

            localInfo.selectedStackIds = [];
            ui.multiBtn.style.display = 'none';
        }

        function playerRequestsDraw() {
            // if (!localInfo.isMyTurn) return;
            const data = { type: 'TRY_DRAW' };
            if (isHost) handlePlayerDraw(gameState.players[0]);
            else conn.send(data);
        }

        // --- ANIMACJE (Z Sosu na Telefon, Z Telefonu na Sos) ---

        function animateCardPlay(card, fromPlayerId, isRemote) {
            // 1. Stwórz latającą kartę
            const flyer = createCardEl(card);
            flyer.classList.add('flying-card');
            document.body.appendChild(flyer);

            // 2. Ustal pozycję startową (od gracza na laptopie lub z dołu ekranu)
            // W prototypie upraszczamy: zawsze leci z dołu (jakby od nas) na środek
            const handRect = ui.hand.getBoundingClientRect();
            const discardRect = ui.discard.getBoundingClientRect();

            flyer.style.left = (handRect.left + handRect.width/2 - 50) + 'px';
            flyer.style.top = (handRect.top) + 'px';

            // 3. Trigger animacji (w następnym frame)
            requestAnimationFrame(() => {
                flyer.style.transform = `translate(${discardRect.left - handRect.left}px, ${discardRect.top - handRect.top}px) rotate(${Math.random()*20-10}deg)`;
            });

            // 4. Posprzątaj
            setTimeout(() => {
                flyer.remove();
            }, 600);
        }

        function animateCardDraw(toPlayerId, isRemote) {
             // Odwrócenie logiczne animateCardPlay
             // Z draw-pile do player-info lub hand container
             // ... Implementacja analogiczna do powyższej ...
             console.log("Animacja dobierania dla p:", toPlayerId);
        }

        // --- ZAAWANSOWANA LOGIKA GRY (TYLKO HOST) ---

        function handlePlayerPlayStack(player, cardIds) {
            if (gameState.currentTurn !== player.id || gameState.waitingForColorSelect) return;

            // 1. Pobierz obiekty kart z ręki
            let playedCards = [];
            cardIds.forEach(id => {
                let card = player.hand.find(c => c.id === id);
                if (card) playedCards.push(card);
            });

            if (playedCards.length === 0) return;

            // 2. Sprawdź walidację (ZASADY Z TWOJEGO OPISU)
            const topCard = gameState.discardPile[gameState.discardPile.length - 1];
            const firstCard = playedCards[0];

            let valid = false;

            // Czy pierwsza karta pasuje?
            if (gameState.forcedDrawCount > 0) {
                // Trwa kumulacja kar (+2, +4)
                if (topCard.value === '+2' && firstCard.value === '+2') valid = true;
                else if (topCard.value === '+4' && (firstCard.value === '+4' || firstCard.value === '+2')) valid = true; // Twoja zasada: +2 na +4
            } else if (gameState.blocksStacked > 0) {
                // Trwa kumulacja blokad
                if (firstCard.type === 'block') valid = true;
            } else {
                // Normalna tura
                if (firstCard.color === gameState.currentColor || firstCard.value === gameState.currentValue || firstCard.color === 'black') {
                    valid = true;
                }
            }

            // Czy reszta kart pasuje do pierwszej (multi-stack)?
            if (playedCards.length > 1) {
                if (!playedCards.every(c => c.value === firstCard.value)) valid = false;
            }

            if (!valid) {
                console.log("Ruch nieprawidłowy");
                return; // Ignoruj zły ruch
            }

            // 3. Wykonaj ruch
            // Usuń z ręki
            player.hand = player.hand.filter(c => !cardIds.includes(c.id));
            
            // Dodaj na sos (ostatnia na górze)
            playedCards.forEach(c => gameState.discardPile.push(c));
            
            const lastCard = playedCards[playedCards.length - 1];
            gameState.currentColor = lastCard.color;
            gameState.currentValue = lastCard.value;

            // 4. Efekty Kart Akcyjnych (ZASADY KUMULACJI)
            processCardEffects(playedCards);

            // Animacje do klientów
            broadcastAnimation('ANIMATE_PLAY', {card: firstCard, fromPlayerId: player.id});

            // Sprawdź wygraną/UNO
            if (player.hand.length === 0) {
                alert(`Gracz ${player.id} WYGRYWA!`);
                // Reset gry...
                return;
            }

            if (gameState.waitingForColorSelect) {
                // Nie kończ tury, czekaj na wybór koloru
                broadcastState();
            } else {
                endTurn();
            }
        }

        function processCardEffects(playedCards) {
            const lastCard = playedCards[playedCards.length - 1];
            const stackSize = playedCards.length;

            switch(lastCard.type) {
                case 'plus2':
                    gameState.forcedDrawCount += (2 * stackSize);
                    break;
                case 'wild4':
                    gameState.forcedDrawCount += (4 * stackSize);
                    gameState.waitingForColorSelect = true;
                    // Host pokazuje picker, klientom wysyła info w state
                    if (gameState.currentTurn === 0) ui.colorPicker.style.display = 'flex';
                    break;
                case 'block':
                    gameState.blocksStacked += stackSize;
                    break;
                case 'reverse':
                    // Parzysta liczba rewersów kasuje efekt w >2 graczy
                    if (gameState.players.length > 2) {
                        if (stackSize % 2 !== 0) gameState.direction *= -1;
                    } else {
                        // W 2 osoby: parzysta gra przeciwnik, nieparzysta ja znowu
                        if (stackSize % 2 !== 0) { /* Ruch wraca, nie zmieniaj tury w endTurn */ }
                        else { /* Gra przeciwnik, zrób normalne endTurn */ }
                    }
                    break;
                case 'wild':
                    gameState.waitingForColorSelect = true;
                    if (gameState.currentTurn === 0) ui.colorPicker.style.display = 'flex';
                    break;
            }
        }

        function handleColorSelection(player, color) {
            if (gameState.currentTurn !== player.id || !gameState.waitingForColorSelect) return;
            
            gameState.currentColor = color;
            gameState.waitingForColorSelect = false;
            ui.colorPicker.style.display = 'none'; // Dla hosta
            endTurn();
        }

        function selectWildColor(color) {
            // Funkcja UI dla gracza (hosta lub klienta)
            if (isHost) handleColorSelection(gameState.players[0], color);
            else conn.send({type: 'COLOR_SELECTED', color});
        }

        function handlePlayerDraw(player) {
            if (gameState.currentTurn !== player.id) return;

            if (gameState.forcedDrawCount > 0) {
                // Gracz nie obronił się przed karnymi kartami - dobiera całość
                for(let i=0; i<gameState.forcedDrawCount; i++) {
                    player.hand.push(gameState.deck.pop()); // Powinno być sprawdzanie pustej talii
                }
                gameState.forcedDrawCount = 0;
                broadcastAnimation('ANIMATE_DRAW', {toPlayerId: player.id, count: gameState.forcedDrawCount});
                endTurn(); // Traci ruch
            } else if (gameState.blocksStacked > 0) {
                // Nie obronił się przed blokadą
                player.blocksToStand = gameState.blocksStacked;
                gameState.blocksStacked = 0;
                endTurn(); // Traci ruch
            } else {
                // Normalne dobranie 1 karty
                const drawn = gameState.deck.pop();
                player.hand.push(drawn);
                broadcastAnimation('ANIMATE_DRAW', {toPlayerId: player.id, count: 1});
                
                // Sprawdź czy pasuje (uproszczenie: w prototypie nie można od razu rzucić)
                broadcastState();
                endTurn(); // Standardowo po dobraniu ruch przechodzi, chyba że pasuje (wersja pro)
            }
        }

        function endTurn() {
            // Logika pomijania tur (Blokady)
            do {
                gameState.currentTurn = (gameState.currentTurn + gameState.direction + gameState.players.length) % gameState.players.length;
                if (gameState.players[gameState.currentTurn].blocksToStand > 0) {
                    gameState.players[gameState.currentTurn].blocksToStand--;
                    console.log(`Gracz ${gameState.currentTurn} stoi. Zostało: ${gameState.players[gameState.currentTurn].blocksToStand}`);
                } else {
                    break; // Znalaziono gracza, który może grać
                }
            } while (true); // Uwaga na nieskończoną pętlę przy wszystkich zablokowanych (mało prawdopodobne w UNO)

            broadcastState();
        }

        // TODO: Implementacja "Krzyknij UNO" przed rzutem, kary (+2) itp.

    </script>
